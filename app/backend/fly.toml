# fly.toml app configuration file generated for grubr-api on 2026-04-04T12:17:52-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Optional prototype Grubhub scrape: ENABLE_GRUBHUB_SCRAPER=true (+ GEMINI_API_KEY for URL inference).
# Set DISABLE_GEMINI_GRUBHUB_URL_LOOKUP=true to skip Gemini → Grubhub URL step. Chrome still required to scrape.

app = 'grubr-api'
primary_region = 'iad'

[env]
  DEMO_MAX_RESTAURANTS = '3'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
